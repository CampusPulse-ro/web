# PR previews, step 1 of 2: build the PR with NO secrets and upload the result. Step 2,
# preview-deploy.yml, runs from main's copy when this succeeds and does the upload to
# Cloudflare, so nothing a PR changes ever runs next to the Cloudflare token.
# Builds point at the stage API. PRs from forks are skipped (no preview).
name: Preview build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_API_BASE: https://campuspulse-api-stage.thorsp.net

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist
          retention-days: 3
          if-no-files-found: error
