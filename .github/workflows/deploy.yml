# Staging and production deploys to Cloudflare Pages (project campuspulse-web):
#   push to main                        -> staging     (staging.campuspulse-web.pages.dev, stage API)
#   published release vX.Y.Z from main  -> production  (campuspulse.thorsp.net, prod API)
#   workflow_dispatch, on main only     -> staging or production
# PR previews are separate: preview-build.yml + preview-deploy.yml.
#
# The Cloudflare token is an environment secret (`cloudflare-pages`, deployable only from
# main and v* tags). Only the deploy job sees it; that job checks nothing out and installs
# nothing, it uploads the files the secret-free build job produced.
name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.t.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release check below needs main's history
          persist-credentials: false

      # Decide the target once. Production only from a real release cut from main, or from a
      # manual run on main; everything else is staging.
      - name: Resolve target
        id: t
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.environment }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          DRAFT: ${{ github.event.release.draft }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::manual deploys run from main only (got $GITHUB_REF)"; exit 1
          fi
          if [ "$EVENT" = "release" ]; then
            [ "$PRERELEASE" = "false" ] && [ "$DRAFT" = "false" ] \
              || { echo "::error::$TAG is a draft or prerelease; production takes real releases only"; exit 1; }
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::release tag '$TAG' is not vX.Y.Z"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$TAG ($GITHUB_SHA) is not on main"; exit 1; }
            target=production
          elif [ "$CHOICE" = "production" ]; then
            target=production
          else
            target=staging
          fi
          if [ "$target" = production ]; then api=https://campuspulse-api.thorsp.net; else api=https://campuspulse-api-stage.thorsp.net; fi
          echo "branch=$target" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "Deploying $target with VITE_API_BASE=$api"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_API_BASE: ${{ steps.t.outputs.api }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: '4.150.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=campuspulse-web --branch=${{ needs.build.outputs.branch }} --commit-hash=${{ github.sha }} --commit-dirty=true
