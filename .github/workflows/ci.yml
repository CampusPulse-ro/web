name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Prettier: fails when a file isn't formatted. Fix locally with `bun run format`.
      - name: Format
        if: ${{ !cancelled() }}
        run: bun run format:check

      # Romanian ș/ț take a comma below; ş/ţ (cedilla) come from the old Windows keyboard and many AIs.
      - name: Romanian diacritics
        if: ${{ !cancelled() }}
        run: "! LC_ALL=C.UTF-8 grep -n '[şţŞŢ]' src/i18n/ro.json"

      # tsc runs as part of build (`tsc -b && vite build`), so a type error fails here too.
      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build
        env:
          # A build must name its API (vite.config.ts); CI builds against stage.
          VITE_API_BASE: https://campuspulse-api-stage.thorsp.net
