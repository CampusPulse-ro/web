name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Prettier: fails when a file isn't formatted. Fix locally with `bun run format`.
      - name: Format
        if: ${{ !cancelled() }}
        run: bun run format:check

      # Romanian ș/ț take a comma below; ş/ţ (cedilla) come from the old Windows keyboard and many AIs.
      - name: Romanian diacritics
        if: ${{ !cancelled() }}
        run: "! LC_ALL=C.UTF-8 grep -n '[şţŞŢ]' src/i18n/ro.json"

      # tsc runs as part of build (`tsc -b && vite build`), so a type error fails here too.
      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build
