# PR previews, step 2 of 2. Runs on workflow_run, which GitHub always runs from the DEFAULT
# BRANCH's copy of this file, never the PR's, so a PR can't change what runs next to the
# Cloudflare token (environment secret `cloudflare-pages`). It uploads the artifact of the
# "Preview build" run that just succeeded to the Pages branch `pr-<number>`.
# The PR number comes from GitHub's event payload, never from the artifact.
name: Preview deploy

on:
  workflow_run:
    workflows: [Preview build]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy preview
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number
    environment: cloudflare-pages
    permissions:
      actions: read # download the other run's artifact
    outputs:
      commit-url: ${{ steps.cf.outputs.deployment-url }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: PR number
        id: pr
        env:
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::no PR number in the event"; exit 1; }
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Deploy to Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: '4.150.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=campuspulse-web --branch=pr-${{ steps.pr.outputs.number }} --commit-hash=${{ github.event.workflow_run.head_sha }} --commit-dirty=true

  comment:
    name: comment preview links
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NUMBER: ${{ needs.deploy.outputs.number }}
          COMMIT_URL: ${{ needs.deploy.outputs.commit-url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const issue_number = Number(process.env.NUMBER);
            const branchUrl = `https://pr-${issue_number}.campuspulse-web.pages.dev`;
            const commitUrl = process.env.COMMIT_URL;
            const sha = (process.env.SHA || '').slice(0, 7);
            const marker = '<!-- campuspulse-preview -->';
            const rows = [`| **PR preview** (always latest) | ${branchUrl} |`];
            if (commitUrl && commitUrl !== branchUrl) rows.push(`| **This commit** (\`${sha}\`) | ${commitUrl} |`);
            const body = `${marker}\n### Preview deployed\n\n| | |\n|---|---|\n${rows.join('\n')}\n\nUpdates on every push · talks to the stage API.`;
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
